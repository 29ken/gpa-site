name: Checks
on:
  push:
  pull_request:
jobs:
  course-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Course data is valid (append-only ids, rules)
        run: node tests/check-course-ids.js
